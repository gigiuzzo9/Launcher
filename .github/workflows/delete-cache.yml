name: Delete Action Cache
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: toshimaru/delete-action-cache@main
        with:
          github-token: ${{ secrets.GH_PAT }}
          repo: gigiuzzo9/Launcher
          limit: 100
